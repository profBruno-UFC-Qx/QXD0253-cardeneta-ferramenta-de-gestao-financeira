<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Caderneta</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>logo</text></svg>">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-vh-100 bg-light" data-area="auth" data-papeis="">
  <div id="toasts" class="position-fixed end-0 top-0 mt-3 mw-100 vstack gap-3 d-print-none z-3"></div>

  <main id="conteudo" class="container-fluid p-0 h-100 min-vh-100">
    <div class="row g-0 min-vh-100">

      <div class="col-lg-5 d-none d-lg-flex flex-column justify-content-between p-5 position-relative auth-banner">
        <div class="z-1">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-dark text-decoration-none">
            <span class="bg-warning rounded-3 p-1 d-flex align-items-center justify-content-center"
              style="width:40px;height:40px">
              <span class="material-symbols-outlined fs-5">storefront</span>
            </span>
            <span class="fw-bold fs-4" data-marca-nome>Caderneta</span>
          </a>
        </div>

        <!--  <div class="z-1 my-auto w-100 text-center">
          <div class="bg-white rounded-4 shadow-lg p-5 d-inline-block w-100" style="max-width: 350px;">
            <span class="material-symbols-outlined text-warning-emphasis" style="font-size: 80px;">fastfood</span>
            <h3 class="fs-5 fw-bold mt-3 text-dark">Comida de verdade</h3>
            <p class="text-secondary small mb-0">Os melhores lanches da cidade, preparados com carinho.</p>
          </div>
        </div> -->

      </div>

      <div class="col-12 col-lg-7 d-flex align-items-center justify-content-center p-4 p-md-5 bg-white">
        <div class="w-100" style="max-width: 500px;">

          <div class="d-lg-none text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-warning rounded-3 mb-2 shadow-sm"
              style="width:48px;height:48px">
              <span class="material-symbols-outlined fs-3">storefront</span>
            </div>
          </div>

          <div class="mb-4">
            <h1 class="fs-3 fw-bold mb-2">Crie sua conta</h1>
            <p class="text-secondary">Preencha seus dados para começar a pedir.</p>
          </div>

          <form id="form-cadastro" class="vstack gap-3">
            <div id="erro" class="d-none rounded-3 bg-danger-subtle p-3 small text-danger-emphasis" role="alert"></div>

            <div>
              <label class="form-label fw-medium" for="nome">Nome completo</label>
              <input id="nome" type="text" class="form-control form-control-lg bg-light border-0" required
                autocomplete="name" placeholder="Seu nome completo">
            </div>

            <div>
              <label class="form-label fw-medium" for="email">E-mail</label>
              <input id="email" type="email" class="form-control form-control-lg bg-light border-0" required
                autocomplete="email" placeholder="seu@email.com">
            </div>

            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label fw-medium" for="cpf">CPF</label>
                <input id="cpf" type="text" class="form-control form-control-lg bg-light border-0" required
                  inputmode="numeric" data-mascara="cpf" maxlength="14" placeholder="000.000.000-00">
              </div>
              <div class="col-sm-6">
                <label class="form-label fw-medium" for="telefone">Telefone</label>
                <input id="telefone" type="tel" class="form-control form-control-lg bg-light border-0" required
                  inputmode="tel" data-mascara="telefone" placeholder="(88) 99999-9999">
              </div>
            </div>

            <div>
              <label class="form-label fw-medium" for="senha">Senha (mínimo de 6 caracteres)</label>
              <input id="senha" type="password" class="form-control form-control-lg bg-light border-0" required
                minlength="6" autocomplete="new-password" placeholder="Crie uma senha forte">
            </div>

            <button id="btn-enviar" type="submit" class="btn btn-warning btn-lg w-100 fw-bold rounded-3 mt-2">Criar
              minha conta</button>
          </form>

          <div class="text-center mt-4">
            <p class="text-secondary small mb-0">Já tem uma conta?
              <a class="fw-bold text-warning-emphasis text-decoration-none" href="login.html">Fazer login</a>
            </p>
            <hr>
            <p class="text-secondary small mb-0">
              <a class="fw-bold text-warning-emphasis text-decoration-none" href="index.html">Acessar Cardapio</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/cadastro.js"></script>
</body>

</html>
