<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | Caderneta</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/cadastro.js" defer></script>
</head>
<body class="pagina-auth">
  <header class="topo">
    <a class="marca" href="index.html"><span class="marca-icone">L</span><span>Caderneta</span></a>
    <a class="link-topo" href="index.html">← Cardápio</a>
  </header>
  <main class="auth-container">
    <section class="auth-card">
      <p class="sobretitulo">Bem-vindo</p>
      <h1>Crie sua conta</h1>
      <p class="auth-intro">Cadastre seus dados para continuar usando o Caderneta.</p>
      <div id="erro" class="alerta erro" role="alert" hidden></div>
      <form id="form-cadastro" class="formulario">
        <label class="campo-grupo" for="nome">Nome completo
          <input id="nome" name="nome" type="text" required maxlength="120" autocomplete="name" placeholder="Seu nome">
        </label>
        <label class="campo-grupo" for="email">E-mail
          <input id="email" name="email" type="email" required maxlength="160" autocomplete="email" placeholder="voce@exemplo.com">
        </label>
        <div class="form-linha">
          <label class="campo-grupo" for="cpf">CPF
            <input id="cpf" name="cpf" type="text" required inputmode="numeric" data-mascara="cpf" maxlength="14" placeholder="000.000.000-00">
          </label>
          <label class="campo-grupo" for="telefone">Telefone
            <input id="telefone" name="telefone" type="tel" required inputmode="tel" data-mascara="telefone" maxlength="16" placeholder="(88) 99999-9999">
          </label>
        </div>
        <label class="campo-grupo" for="senha">Senha <span class="hint-inline">mínimo 6 caracteres</span>
          <input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password" placeholder="Crie uma senha">
        </label>
        <button id="btn-enviar" class="botao botao-principal botao-largo" type="submit">Criar conta</button>
      </form>
      <p class="auth-rodape">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
