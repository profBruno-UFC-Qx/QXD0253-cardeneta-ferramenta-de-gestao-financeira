<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Caderneta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css">
</head>
<body class="d-md-flex min-vh-100 bg-white" data-area="painel" data-papeis="gerente">
  <div id="toasts" class="position-fixed end-0 bottom-0 mb-4 mw-100 vstack gap-2 p-3 d-print-none z-3" aria-live="polite"></div>
  <main id="conteudo" class="w-100 container-fluid flex-fill vstack gap-4 p-3 p-md-4 bg-light">
    <header class="d-flex flex-wrap align-items-end justify-content-between gap-3"><div><h1 class="fs-3 fw-bold mb-1">Dashboard</h1><p class="text-secondary small mb-0" id="periodo-label">Visão geral das vendas</p></div>
      <div class="btn-group d-print-none" role="group" aria-label="Período"><button class="btn btn-outline-secondary" data-periodo="hoje">Hoje</button><button class="btn btn-outline-secondary" data-periodo="7dias">7 dias</button><button class="btn btn-warning fw-semibold" data-periodo="mes">Mês atual</button></div>
    </header>
    <section id="indicadores" class="row g-3" aria-live="polite"></section>
    <section class="row g-3"><div class="col-12 col-xl-8"><article class="card border-0 shadow-sm h-100"><div class="p-3 border-bottom"><h2 class="fs-6 fw-bold mb-0">Vendas por dia</h2></div><div id="grafico-vendas" class="p-3"></div></article></div>
      <div class="col-12 col-xl-4"><article class="card border-0 shadow-sm h-100"><div class="p-3 border-bottom d-flex justify-content-between"><h2 class="fs-6 fw-bold mb-0">Produtos mais vendidos</h2><a class="small text-decoration-none" href="relatorios.html">Relatórios</a></div><div id="top-produtos" class="p-3 vstack gap-3"></div></article></div></section>
    <section class="card border-0 shadow-sm"><div class="p-3 d-flex flex-wrap justify-content-between gap-2 align-items-center"><div><h2 class="fs-6 fw-bold mb-1">Acesso rápido</h2><p class="small text-secondary mb-0">Gestão financeira e desempenho do negócio</p></div><div class="d-flex gap-2"><a class="btn btn-warning fw-semibold" href="financeiro.html">Despesas</a><a class="btn btn-outline-secondary" href="relatorios.html">Ver relatórios</a><a class="btn btn-outline-secondary" href="pedidos.html">Pedidos</a></div></div></section>
  </main>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/pages/dashboard.js"></script>
</body>
</html>
