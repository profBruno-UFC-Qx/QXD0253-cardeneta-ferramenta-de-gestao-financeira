<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha conta | Caderneta</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>logo</text></svg>">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light" data-area="loja" data-papeis="authenticated,atendente,gerente">
  <div id="toasts" class="position-fixed end-0 top-0 mt-3 mw-100 vstack gap-3 d-print-none z-3"></div>
  <main id="conteudo" class="mx-auto w-100 container-xl flex-fill px-3 py-3 pb-5 mb-2">
    <h1 class="mb-3 fs-4 fw-bold">Minha conta</h1>

    <section class="row g-4 align-items-start">

      <div class="col-12 col-lg-5">
        <form id="form-conta" class="card border-0 shadow-sm vstack gap-3 p-3 h-100">
          <h2 class="fs-5 fw-bold">Meus dados</h2>
          <div id="erro-conta" class="alert alert-danger" role="alert" hidden></div>
          <div><label class="form-label" for="u-nome">Nome completo</label><input id="u-nome" class="form-control"
              maxlength="120" autocomplete="name" required></div>
          <div><label class="form-label" for="u-email">E-mail</label><input id="u-email" class="form-control"
              type="email" disabled></div>
          <div><label class="form-label" for="u-cpf">CPF</label><input id="u-cpf" class="form-control"
              inputmode="numeric" data-mascara="cpf" maxlength="14"></div>
          <div><label class="form-label" for="u-telefone">Telefone</label><input id="u-telefone" class="form-control"
              type="tel" inputmode="tel" data-mascara="telefone" maxlength="16" required></div>
          <button type="submit" class="btn btn-warning fw-semibold mt-auto">Salvar dados</button>
        </form>
      </div>

      <div class="col-12 col-lg-7">
        <section class="card border-0 shadow-sm p-3 h-100" aria-labelledby="titulo-enderecos">
          <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
            <div>
              <h2 id="titulo-enderecos" class="fs-5 fw-bold mb-1">Meus endereços</h2>
              <p class="text-secondary small mb-0">Endereços visíveis somente na sua conta.</p>
            </div>
            <button id="btn-novo-endereco" class="btn btn-outline-secondary btn-sm flex-shrink-0 rounded-3"
              type="button">+ Novo</button>
          </div>
          <div id="lista-enderecos" class="vstack gap-3" aria-live="polite">
            <p class="text-secondary small mb-0">Carregando endereços…</p>
          </div>

          <form id="form-endereco" class="vstack gap-3 mt-3 border-top pt-3" hidden>
            <input id="end-id" type="hidden">
            <h3 id="titulo-form-endereco" class="fs-6 fw-bold mb-0">Novo endereço</h3>
            <div class="row g-3 row-cols-sm-2">
              <div><label class="form-label" for="end-rotulo">Apelido</label><select id="end-rotulo"
                  class="form-select">
                  <option>Casa</option>
                  <option>Trabalho</option>
                  <option>Outro</option>
                </select></div>
              <div><label class="form-label" for="end-cep">CEP</label><input id="end-cep" class="form-control"
                  inputmode="numeric" maxlength="9" placeholder="00000-000"></div>
              <div class="col-sm-12"><label class="form-label" for="end-destinatario">Quem vai receber</label><input
                  id="end-destinatario" class="form-control" required maxlength="120" autocomplete="name"></div>
              <div class="col-sm-12"><label class="form-label" for="end-telefone">Telefone de quem recebe</label><input
                  id="end-telefone" class="form-control" type="tel" inputmode="tel" data-mascara="telefone"
                  maxlength="16"></div>
              <div class="col-sm-12"><label class="form-label" for="end-rua">Rua</label><input id="end-rua"
                  class="form-control" required maxlength="200" autocomplete="street-address"></div>
              <div><label class="form-label" for="end-numero">Número</label><input id="end-numero" class="form-control"
                  required maxlength="40"></div>
              <div><label class="form-label" for="end-complemento">Complemento</label><input id="end-complemento"
                  class="form-control" maxlength="120" placeholder="Apto, bloco..."></div>
              <div><label class="form-label" for="end-bairro">Bairro</label><input id="end-bairro" class="form-control"
                  required maxlength="120"></div>
              <div><label class="form-label" for="end-cidade">Cidade</label><input id="end-cidade" class="form-control"
                  maxlength="120"></div>
              <div class="col-sm-12"><label class="form-label" for="end-referencia">Ponto de referência</label><input
                  id="end-referencia" class="form-control" maxlength="200" placeholder="Ex.: perto da praça"></div>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <button id="btn-salvar-endereco" class="btn btn-warning fw-semibold" type="submit">Salvar
                endereço</button>
              <button id="btn-cancelar-endereco" class="btn btn-outline-secondary" type="button">Cancelar</button>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/enderecos.js"></script>
  <script src="js/perfil.js"></script>
</body>

</html>
