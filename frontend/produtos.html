<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos - Caderneta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-md-flex min-vh-100 bg-white" data-area="painel" data-papeis="atendente,gerente">
  <div id="toasts" class="position-fixed end-0 bottom-0 mb-4 mw-100 vstack gap-2 p-3 d-print-none z-3" aria-live="polite">
  </div>
  <main id="conteudo" class="w-100 container-fluid flex-fill vstack gap-4 p-3 p-md-4 pb-5 bg-light">
    <header class="d-flex flex-wrap align-items-end justify-content-between gap-3">
      <div>
        <h1 class="fs-3 fw-bold mb-1">Produtos</h1>
        <p id="resumo" class="text-secondary small mb-0">Carregando...</p>
      </div>
      <button id="btn-novo" type="button" class="btn btn-warning fw-semibold"><span
          class="material-symbols-outlined align-middle fs-5">add</span> Novo produto</button>
    </header>

    <section class="card border-0 shadow-sm" aria-label="Filtros de produtos">
      <div class="row g-2 p-3">
        <div class="col-12 col-md-7"><label class="visually-hidden" for="busca">Buscar produto</label><input id="busca"
            class="form-control" type="search" placeholder="Buscar produto" autocomplete="off"></div>
        <div class="col-12 col-md-5"><label class="visually-hidden" for="filtro-categoria">Filtrar por
            categoria</label><select id="filtro-categoria" class="form-select">
            <option value="">Todas as categorias</option>
          </select></div>
      </div>
    </section>

    <div id="grade" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mb-4" aria-live="polite"></div>
    <div id="paginacao-produtos"></div>

    <dialog id="dlg-produto" class="w-100 border-0 rounded-3 p-0 shadow" style="max-width:640px;max-height:92vh">
      <form id="dlg-produto-form" class="vstack gap-3 p-3 p-md-4 overflow-y-auto">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3">
          <h2 id="dlg-produto-titulo" class="fs-5 fw-bold mb-0">Novo produto</h2>
          <button type="button" data-fechar class="btn btn-light p-2" aria-label="Fechar"><span
              class="material-symbols-outlined">close</span></button>
        </div>
        <div><label class="form-label" for="p-nome">Nome</label><input id="p-nome" class="form-control" maxlength="120"
            required></div>
        <div><label class="form-label" for="p-descricao">Descrição</label><textarea id="p-descricao"
            class="form-control" rows="3" maxlength="1000"></textarea></div>
        <div class="row g-3">
          <div class="col-12 col-sm-5"><label class="form-label" for="p-preco">Preço (R$)</label><input id="p-preco"
              class="form-control" type="number" min="0" step="0.01" required></div>
          <div class="col-12 col-sm-7"><label class="form-label" for="p-categoria">Categoria</label><select
              id="p-categoria" class="form-select">
              <option value="">Sem categoria</option>
            </select></div>
        </div>
        <section id="secao-adicionais" class="rounded-3 border bg-light p-3">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
            <div><h3 class="fs-6 fw-semibold mb-1">Adicionais do catálogo</h3><p class="small text-secondary mb-0">Marque quais opções o cliente poderá escolher neste produto.</p></div>
          </div>
          <div id="p-adicionais-lista" class="vstack gap-2"></div>
        </section>
        <section>
          <h3 class="form-label mb-2">Imagem principal</h3>
          <div class="d-flex align-items-center gap-3">
            <div id="p-previa"
              class="d-flex align-items-center justify-content-center overflow-hidden rounded-3 border bg-light"
              style="width:104px;height:88px"><span
                class="material-symbols-outlined text-secondary fs-2">add_photo_alternate</span></div>
            <div class="vstack align-items-start gap-2">
              <label class="btn btn-outline-secondary btn-sm">Escolher ou trocar<input id="p-arquivo"
                  class="visually-hidden" type="file" accept="image/*"></label>
              <button id="p-limpar-arquivo" class="btn btn-link btn-sm text-danger p-0 d-none" type="button">Desfazer
                seleção</button>
              <button id="p-remover-imagem" class="btn btn-link btn-sm text-danger p-0 d-none" type="button">Excluir
                imagem salva</button>
            </div>
          </div>
        </section>
        <section>
          <label class="form-label" for="p-galeria-arquivos">Galeria do produto</label>
          <input id="p-galeria-arquivos" class="form-control" type="file" accept="image/*" multiple>
          <div id="p-galeria-atual" class="d-flex flex-wrap gap-2 mb-2"></div>
          <div id="p-galeria-novas" class="vstack gap-1 small"></div>
        </section>
        <div class="form-check form-switch">
          <input id="p-disponivel" class="form-check-input" type="checkbox" role="switch" checked>
          <label class="form-check-label" for="p-disponivel">Disponível para pedido</label>
        </div>
        <div class="d-flex justify-content-end gap-2 border-top pt-3">
          <button type="button" data-fechar class="btn btn-outline-secondary">Cancelar</button>
          <button type="submit" class="btn btn-warning fw-semibold">Salvar produto</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/produtos.js"></script>
</body>

</html>
